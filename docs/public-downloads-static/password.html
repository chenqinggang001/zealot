<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>访问验证 — App 下载中心</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="public-downloads__canvas-topbar">
      <div class="public-downloads__canvas-topbar-inner">
        <div class="public-downloads__canvas-brand">
          <span class="public-downloads__canvas-brand-title">App 下载中心</span>
          <span class="public-downloads__canvas-brand-route">访问验证</span>
        </div>
        <nav class="public-downloads__canvas-nav" aria-label="设计稿页面">
          <a class="public-downloads__canvas-nav-link" href="./index.html">应用列表</a>
          <a class="public-downloads__canvas-nav-link" href="./detail.html">下载详情</a>
          <a class="public-downloads__canvas-nav-link is-active" href="./password.html">密码访问</a>
          <a class="public-downloads__canvas-nav-link" href="./spec.html">设计规范</a>
        </nav>
      </div>
    </header>

    <main class="public-downloads public-downloads--canvas-password">
      <div class="public-downloads__canvas-password-wrap">
        <div class="public-downloads__canvas-password-stack">
          <div class="public-downloads__canvas-password-hero">
            <div class="public-downloads__canvas-app-icon public-downloads__canvas-app-icon--xl public-downloads__canvas-app-icon--a" aria-hidden="true">B</div>
            <h1 class="public-downloads__canvas-password-appname">BizTrack</h1>
            <div class="public-downloads__canvas-password-pills">
              <span class="public-downloads__canvas-pill">Android</span>
              <span class="public-downloads__canvas-pill public-downloads__canvas-pill--warn">测试环境</span>
            </div>
            <p class="public-downloads__canvas-password-sub">v3.3.0-beta · Build #1031</p>
          </div>

          <article class="public-downloads__canvas-auth-card">
            <h2 class="public-downloads__canvas-auth-title">访问验证</h2>
            <p class="public-downloads__canvas-auth-lead">该应用设置了访问密码，请输入密码以继续</p>

            <form class="public-downloads__canvas-auth-form" action="./detail.html" method="get">
              <label class="public-downloads__canvas-label" for="access-password">访问密码</label>
              <input class="public-downloads__canvas-input" id="access-password" name="password" type="password" autocomplete="current-password" placeholder="请输入访问密码">
              <button class="public-downloads__canvas-btn public-downloads__canvas-btn--primary public-downloads__canvas-btn--block" type="submit">确认访问</button>
            </form>
          </article>
        </div>
      </div>
    </main>
  </body>
</html>
